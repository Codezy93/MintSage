name: Live agent tool evaluation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model for this run
        required: true
        default: gemini-2.5-flash
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r agent_service/requirements.txt pytest==9.2.0
      - run: python -m pytest -q agent_service/tests
        env:
          MINTSAGE_LIVE_EVAL: '1'
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
